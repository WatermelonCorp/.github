name: Bug report
description: Report a broken behavior, regression, or incorrect output
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Please share enough detail for us to reproduce the problem.
  - type: input
    id: repo
    attributes:
      label: Repository
      description: Which Watermelon repository is affected?
      placeholder: watermelon-platform
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      placeholder: A clear and concise description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: Browser, OS, package manager, Node or Bun version
