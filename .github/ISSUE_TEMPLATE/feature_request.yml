name: Feature request
description: Suggest an improvement, new capability, or workflow change
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please describe the problem first, then the solution you want.
  - type: input
    id: repo
    attributes:
      label: Repository
      description: Which Watermelon repository should this apply to?
      placeholder: watermellon-registry
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      placeholder: What is difficult, missing, or frustrating today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      placeholder: What would you like to see happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: Any workarounds or other ideas you tried
